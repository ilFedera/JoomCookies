name: JoomCookies checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, dom, json
      - name: Validate PHP syntax
        run: find extensions package tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript syntax
        run: node --check extensions/plg_system_joomcookies/media/js/joomcookies.js
      - name: Run existing regression suite
        run: php tests/run.php
