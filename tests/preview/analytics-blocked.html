<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>JoomCookies Analytics blocked</title>
  <script>
    document.cookie = 'joomcookies_consent=; Path=/; Max-Age=0; SameSite=Lax';
    try { localStorage.removeItem('joomcookies.consent'); } catch (e) {}
    window.__jckTest = { gtagLoads: 0, loadCallbacks: 0 };
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });
    window.$load = function (fn) {
      fn({ google_analytics: 'G-TESTID', google_analytics_anonymize: true }, function () {});
    };
  </script>
</head>
<body>
  <script type="text/plain" data-jck-managed="1" data-jck-category="statistics" data-jck-service="yootheme-analytics" data-jck-src="./yootheme-analytics-stub.js"></script>
  <p id="result">running</p>
  <script type="application/json" id="joomcookies-config">{"enabled":true,"version":"1","position":"bottom","theme":{"background":"#111827","text":"#F9FAFB","accent":"#2563EB","buttonText":"#FFFFFF","muted":"#D1D5DB"},"texts":{"title":"Usiamo i cookie","message":"Test","accept":"Accetta tutti","reject":"Rifiuta tutti","customize":"Personalizza","save":"Salva","close":"Chiudi","reopen":"Preferenze"},"links":{},"categories":{"necessary":{"id":"necessary","label":"Necessari","required":true},"statistics":{"id":"statistics","label":"Statistiche","required":false}},"services":[{"id":"yootheme-analytics","name":"YOOtheme","category":"statistics","cookies":["_ga"]}],"cookie":{"name":"joomcookies_consent","days":180,"path":"/","sameSite":"Lax"},"youtube":{"nocookie":true,"thumbnails":"local"},"ui":{"reopen":true,"diagnostic":true},"reloadOnRevoke":false}</script>
  <div id="joomcookies-root" class="jck-root" data-jck-root="1">
    <div class="jck-overlay" data-jck-overlay="1" hidden></div>
    <section class="jck-banner" data-jck-banner="1" hidden role="dialog">
      <button type="button" data-jck-action="reject">Rifiuta tutti</button>
      <button type="button" data-jck-action="accept">Accetta tutti</button>
    </section>
    <section class="jck-panel" data-jck-panel="1" hidden role="dialog"></section>
  </div>
  <script src="../../extensions/plg_system_joomcookies/media/js/joomcookies.js?v=2.2.5" id="joomcookies-runtime"></script>
  <script>
    setTimeout(function () {
      document.getElementById('result').textContent = JSON.stringify({
        gtagScripts: document.querySelectorAll('script[src*="googletagmanager.com/gtag/js"]').length,
        managedLoaded: document.querySelectorAll('script[data-jck-loaded="1"]').length,
        loadCallbacks: window.__jckTest.loadCallbacks,
        statistics: !!(window.JoomCookies && window.JoomCookies.hasConsent('statistics'))
      });
    }, 600);
  </script>
</body>
</html>
