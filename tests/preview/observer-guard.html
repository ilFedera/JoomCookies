  <script>
    window.__jckMutations = 0;
    var nativeObserve = MutationObserver.prototype.observe;
    document.documentElement.addEventListener('jck-count', function () {});

      window.__jckMutations += records.length;
    });
    probe.observe(document.documentElement, { childList: true, subtree: true });

      var frozen = window.__jckMutations > 200;
      document.getElementById('result').textContent = JSON.stringify({
        mutations: window.__jckMutations,
        placeholders: placeholders,
        frozen: frozen,
